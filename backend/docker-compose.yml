services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: washworld_eksamen_flask
    depends_on:
      - mariadb
    ports:
      - 80:80 # 0 - 1024 reserved. Use any port from 1025 to 65535
    volumes:
      - .:/app
    env_file:
      - .env
 
  mariadb:
    image: mariadb:10.6.20
    container_name: washworld_eksamen_mariadb
    environment:
      # MYSQL_ROOT_PASSWORD: password
      # MYSQL_DATABASE: washworld_eksamen
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 3307:3306
 
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: washworld_eksamen_phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      # MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - 8080:80
 
volumes:
  mariadb_data: